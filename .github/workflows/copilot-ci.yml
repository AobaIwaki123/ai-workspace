name: Copilot CI Demo

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Copilotに尋ねるプロンプト'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Copilot CLI Security Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PRの差分を取得して変数に格納
          PR_DIFF=$(gh pr diff ${{ github.event.pull_request.number }})

          # 非対話モード (-p / --prompt) で Copilot CLI を呼び出す
          gh copilot -p "以下のPR差分を分析し，セキュリティ上の問題点や改善提案を簡潔に列挙してください．
          
          ---
          $PR_DIFF" \
          --allow-tool='shell(*)'

  copilot-custom-prompt:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Copilot CLI extension
        run: gh extension install github/gh-copilot

      - name: Run custom Copilot prompt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh copilot suggest -t shell "${{ github.event.inputs.prompt }}"# test
# test
