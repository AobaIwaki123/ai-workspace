apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: isucon
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: isucon-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_HOST
              value: "mysql"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: "isucon"
            - name: MYSQL_PASSWORD
              value: "isucon"
            - name: MYSQL_DATABASE
              value: "isucon"
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 6060
              name: pprof
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: isucon
  labels:
    app: app
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
    - port: 6060
      targetPort: 6060
      name: pprof
  selector:
    app: app
