apiVersion: v1
kind: ConfigMap
metadata:
  name: isucon-app-source
  namespace: isucon
data:
  go.mod: |
    module isucon-sandbox

    go 1.22

    require (
    	github.com/go-sql-driver/mysql v1.8.1
    	github.com/jmoiron/sqlx v1.4.0
    )

    require filippo.io/edwards25519 v1.1.0 // indirect

  go.sum: |
    filippo.io/edwards25519 v1.1.0 h1:FNf4tywRC1HmFuKW5xopWpigGjJKiJSV0Cqo0cJWDaA=
    filippo.io/edwards25519 v1.1.0/go.mod h1:BxyFTGdWcka3PhytdK4V28tE5sGfRvvvRV7EaN4VDT4=
    github.com/go-sql-driver/mysql v1.8.1 h1:LedoTUt/eveggdHS9qUFC1EFSa8bU2+1pZjSRpvNJ1Y=
    github.com/go-sql-driver/mysql v1.8.1/go.mod h1:wEBSXgmK//2ZFJyE+qWnIsVGmvmEKlqwuVSjsCm7DZg=
    github.com/jmoiron/sqlx v1.4.0 h1:1PLqN7S1UYp5t4SrVVnt4nUVNemrDAtxlulVe+Qgm3o=
    github.com/jmoiron/sqlx v1.4.0/go.mod h1:ZrZ7UsYB/weZdl2Bxg6jCRO9c3YHl8r3ahlKmRT4JLY=
    github.com/lib/pq v1.10.9 h1:YXG7RB+JIjhP29X+OtkiDnYaXQwpS4JEWq7dtCCRUEw=
    github.com/lib/pq v1.10.9/go.mod h1:AlVN5x4E4T544tWzH6hKfbfQvm3HdbOxrmggDNAPY9o=
    github.com/mattn/go-sqlite3 v1.14.22 h1:2gZY6PC6kBnID23Tichd1K+Z0oS6nE/XwU+Vz/5o4kU=
    github.com/mattn/go-sqlite3 v1.14.22/go.mod h1:Uh1q+B4BYcTPb+yiD3kU8Ct7aC0hY9fxUwlHK0RXw+Y=

  main.go: |
    package main

    import (
    	"database/sql"
    	"embed"
    	"encoding/json"
    	"fmt"
    	"io/fs"
    	"log"
    	"net/http"
    	"net/http/pprof"
    	"os"
    	"regexp"
    	"strconv"
    	"strings"
    	"time"

    	_ "github.com/go-sql-driver/mysql"
    	"github.com/jmoiron/sqlx"
    )

    //go:embed public/*
    var publicFS embed.FS

    var db *sqlx.DB

    type User struct {
    	ID        int64     `db:"id" json:"id"`
    	Name      string    `db:"name" json:"name"`
    	Email     string    `db:"email" json:"email"`
    	CreatedAt time.Time `db:"created_at" json:"created_at"`
    }

    type Post struct {
    	ID           int64     `db:"id" json:"id"`
    	UserID       int64     `db:"user_id" json:"user_id"`
    	Title        string    `db:"title" json:"title"`
    	Content      string    `db:"content" json:"content"`
    	Status       string    `db:"status" json:"status"`
    	ViewCount    int       `db:"view_count" json:"view_count"`
    	CreatedAt    time.Time `db:"created_at" json:"created_at"`
    	UserName     string    `json:"user_name,omitempty"`
    	CommentCount int       `json:"comment_count"`
    }

    type Comment struct {
    	ID        int64     `db:"id" json:"id"`
    	PostID    int64     `db:"post_id" json:"post_id"`
    	UserID    int64     `db:"user_id" json:"user_id"`
    	Body      string    `db:"body" json:"body"`
    	CreatedAt time.Time `db:"created_at" json:"created_at"`
    }

    func initDB() {
    	host := os.Getenv("MYSQL_HOST")
    	if host == "" {
    		host = "127.0.0.1"
    	}
    	port := os.Getenv("MYSQL_PORT")
    	if port == "" {
    		port = "3306"
    	}
    	user := os.Getenv("MYSQL_USER")
    	if user == "" {
    		user = "isucon"
    	}
    	pass := os.Getenv("MYSQL_PASSWORD")
    	if pass == "" {
    		pass = "isucon"
    	}
    	dbname := os.Getenv("MYSQL_DATABASE")
    	if dbname == "" {
    		dbname = "isucon"
    	}

    	dsn := fmt.Sprintf("%s:%s@tcp(%s:%s)/%s?parseTime=true&loc=Local", user, pass, host, port, dbname)
    	var err error
    	db, err = sqlx.Connect("mysql", dsn)
    	if err != nil {
    		log.Fatalf("Failed to connect to MySQL: %v", err)
    	}

    	// コネクション設定
    	db.SetMaxOpenConns(50)
    	db.SetMaxIdleConns(50)
    }

    // ❌ 意図的なボトルネック1: N+1 クエリ (投稿一覧)
    func handleGetPosts(w http.ResponseWriter, r *http.Request) {
    	// 1. 投稿一覧を取得 (status='published' でソート。IndexがないのでFull Scan)
    	var posts []Post
    	err := db.Select(&posts, "SELECT id, user_id, title, content, status, view_count, created_at FROM posts WHERE status = 'published' ORDER BY created_at DESC LIMIT 30")
    	if err != nil {
    		http.Error(w, err.Error(), http.StatusInternalServerError)
    		return
    	}

    	// 2. N+1: 投稿ごとにユーザー名とコメント数を1件ずつクエリで取得！
    	for i := range posts {
    		// ユーザー名取得 (N回クエリ)
    		var user User
    		if err := db.Get(&user, "SELECT name FROM users WHERE id = ?", posts[i].UserID); err != nil && err != sql.ErrNoRows {
    			http.Error(w, err.Error(), http.StatusInternalServerError)
    			return
    		}
    		posts[i].UserName = user.Name

    		// コメント数取得 (N回クエリ & post_idにIndexがないので毎回Full Scan)
    		var count int
    		if err := db.Get(&count, "SELECT COUNT(*) FROM comments WHERE post_id = ?", posts[i].ID); err != nil && err != sql.ErrNoRows {
    			http.Error(w, err.Error(), http.StatusInternalServerError)
    			return
    		}
    		posts[i].CommentCount = count
    	}

    	w.Header().Set("Content-Type", "application/json")
    	json.NewEncoder(w).Encode(posts)
    }

    // ❌ 意図的なボトルネック2: スロークエリ (単一投稿詳細)
    func handleGetPostDetail(w http.ResponseWriter, r *http.Request) {
    	idStr := strings.TrimPrefix(r.URL.Path, "/api/posts/")
    	id, err := strconv.ParseInt(idStr, 10, 64)
    	if err != nil {
    		http.Error(w, "Invalid post ID", http.StatusBadRequest)
    		return
    	}

    	var post Post
    	err = db.Get(&post, "SELECT * FROM posts WHERE id = ?", id)
    	if err == sql.ErrNoRows {
    		http.Error(w, "Post not found", http.StatusNotFound)
    		return
    	} else if err != nil {
    		http.Error(w, err.Error(), http.StatusInternalServerError)
    		return
    	}

    	// コメント一覧 (post_idにIndexなし)
    	var comments []Comment
    	if err := db.Select(&comments, "SELECT * FROM comments WHERE post_id = ? ORDER BY created_at ASC", id); err != nil {
    		http.Error(w, err.Error(), http.StatusInternalServerError)
    		return
    	}

    	w.Header().Set("Content-Type", "application/json")
    	json.NewEncoder(w).Encode(map[string]interface{}{
    		"post":     post,
    		"comments": comments,
    	})
    }

    // ❌ 意図的なボトルネック3: CPU負荷（正規表現のコンパイルループ）
    func handleHeavyCalc(w http.ResponseWriter, r *http.Request) {
    	text := "ISUCON is a competition where you speed up web applications to the maximum limit!"
    	matchCount := 0

    	// 毎回正規表現を再コンパイルする悪手 (pprofのCPUプロファイルで劇的に目立つ)
    	for i := 0; i < 5000; i++ {
    		re := regexp.MustCompile(`(ISUCON|applications|limit)`)
    		if re.MatchString(text) {
    			matchCount++
    		}
    	}

    	w.Header().Set("Content-Type", "application/json")
    	json.NewEncoder(w).Encode(map[string]interface{}{
    		"result": "ok",
    		"count":  matchCount,
    	})
    }

    func main() {
    	initDB()
    	log.Println("Database connected successfully.")

    	// pprof を別ポート (6060) で起動
    	go func() {
    		log.Println("Starting pprof on :6060")
    		if err := http.ListenAndServe("0.0.0.0:6060", nil); err != nil {
    			log.Printf("pprof server error: %v", err)
    		}
    	}()

    	mux := http.NewServeMux()
    	mux.HandleFunc("/health", func(w http.ResponseWriter, r *http.Request) {
    		w.WriteHeader(http.StatusOK)
    		w.Write([]byte("OK"))
    	})
    	mux.HandleFunc("/api/posts", handleGetPosts)
    	mux.HandleFunc("/api/posts/", handleGetPostDetail)
    	mux.HandleFunc("/api/heavy-calc", handleHeavyCalc)

    	// pprof ハンドラをメイン mux にも登録
    	mux.HandleFunc("/debug/pprof/", pprof.Index)
    	mux.HandleFunc("/debug/pprof/cmdline", pprof.Cmdline)
    	mux.HandleFunc("/debug/pprof/profile", pprof.Profile)
    	mux.HandleFunc("/debug/pprof/symbol", pprof.Symbol)
    	mux.HandleFunc("/debug/pprof/trace", pprof.Trace)

    	// 静的フロントエンド配信 (index.html)
    	if subFS, err := fs.Sub(publicFS, "public"); err == nil {
    		mux.Handle("/", http.FileServer(http.FS(subFS)))
    	}

    	server := &http.Server{
    		Addr:    ":8000",
    		Handler: mux,
    	}

    	log.Println("Starting API server on :8000")
    	if err := server.ListenAndServe(); err != nil {
    		log.Fatalf("Server error: %v", err)
    	}
    }

  index.html: |
    <!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>🚀 ISUCON 模擬プラットフォーム</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
            body { font-family: 'Inter', sans-serif; }
            code, pre { font-family: 'JetBrains Mono', monospace; }
        </style>
    </head>
    <body class="bg-slate-950 text-slate-100 min-h-screen">
        <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center shadow-lg shadow-rose-500/20">
                        <i data-lucide="zap" class="w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                            ISUCON Sandbox
                        </h1>
                        <p class="text-xs text-slate-400">Kubernetes & Local Performance Lab</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="hidden sm:flex items-center space-x-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="health-badge">System Healthy</span>
                    </div>
                    <a href="/debug/pprof/" target="_blank" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 border border-slate-700 transition">
                        <i data-lucide="activity" class="w-4 h-4 text-cyan-400"></i>
                        <span>pprof</span>
                    </a>
                </div>
            </div>
        </header>
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <section class="mb-8 rounded-2xl bg-gradient-to-br from-slate-900 via-slate-900 to-slate-850 border border-slate-800 p-6 shadow-xl relative overflow-hidden">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                    <div>
                        <h2 class="text-xl font-bold text-white flex items-center gap-2">
                            <i data-lucide="gauge" class="w-5 h-5 text-rose-400"></i>
                            リアルタイム API パフォーマンス計測
                        </h2>
                        <p class="text-sm text-slate-400 mt-1">
                            現在のバックエンド API をブラウザから直接リクエストし、レイテンシとボトルネックを可視化します。
                        </p>
                    </div>
                    <button id="btn-measure" onclick="runPerformanceTest()" class="flex items-center justify-center space-x-2 px-5 py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-amber-500 hover:from-rose-600 hover:to-amber-600 text-white font-semibold shadow-lg shadow-rose-500/25 transition transform active:scale-95 cursor-pointer">
                        <i data-lucide="play" class="w-4 h-4"></i>
                        <span>⚡ 一括測定を実行</span>
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="rounded-xl bg-slate-950/60 border border-slate-800/80 p-4 relative group hover:border-slate-700 transition">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300">GET /api/posts</span>
                            <span class="text-xs px-2 py-0.5 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 font-medium">🔴 N+1 発生中</span>
                        </div>
                        <div class="text-2xl font-bold font-mono text-white mt-2" id="metric-posts">- ms</div>
                        <p class="text-xs text-slate-400 mt-1">投稿一覧 + ユーザー・コメント個別クエリ</p>
                    </div>
                    <div class="rounded-xl bg-slate-950/60 border border-slate-800/80 p-4 relative group hover:border-slate-700 transition">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300">GET /api/posts/1</span>
                            <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">🟢 単一投稿</span>
                        </div>
                        <div class="text-2xl font-bold font-mono text-white mt-2" id="metric-detail">- ms</div>
                        <p class="text-xs text-slate-400 mt-1">投稿詳細 + コメントリスト取得</p>
                    </div>
                    <div class="rounded-xl bg-slate-950/60 border border-slate-800/80 p-4 relative group hover:border-slate-700 transition">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300">GET /api/heavy-calc</span>
                            <span class="text-xs px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium">🟡 CPU 負荷</span>
                        </div>
                        <div class="text-2xl font-bold font-mono text-white mt-2" id="metric-calc">- ms</div>
                        <p class="text-xs text-slate-400 mt-1">ループ内正規表現 5,000回 コンパイル</p>
                    </div>
                </div>
            </section>
            <section>
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 class="text-xl font-bold text-white flex items-center gap-2">
                            <i data-lucide="message-square" class="w-5 h-5 text-indigo-400"></i>
                            投稿フィード (タイムライン)
                        </h2>
                        <p class="text-sm text-slate-400">MySQL データベースから取得した投稿一覧です。</p>
                    </div>
                    <button onclick="fetchPosts()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 border border-slate-700 transition cursor-pointer">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                        <span>再読み込み</span>
                    </button>
                </div>
                <div id="posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="col-span-full py-16 text-center text-slate-500 flex flex-col items-center justify-center">
                        <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-rose-500 mb-3"></i>
                        <p class="text-sm">投稿データを取得中...</p>
                    </div>
                </div>
            </section>
        </main>
        <div id="post-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                <div class="p-6 border-b border-slate-800 flex items-center justify-between">
                    <h3 id="modal-title" class="text-lg font-bold text-white">投稿詳細</h3>
                    <button onclick="closeModal()" class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition cursor-pointer">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="p-6 overflow-y-auto space-y-6">
                    <div>
                        <div class="flex items-center gap-2 text-xs text-slate-400 mb-2">
                            <span id="modal-author" class="font-semibold text-slate-200">ユーザー名</span>
                            <span>•</span>
                            <span id="modal-date">日時</span>
                        </div>
                        <p id="modal-content" class="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap"></p>
                    </div>
                    <div class="border-t border-slate-800 pt-4">
                        <h4 class="text-sm font-semibold text-slate-200 mb-3 flex items-center gap-2">
                            <i data-lucide="message-circle" class="w-4 h-4 text-indigo-400"></i>
                            コメント (<span id="modal-comment-count">0</span>)
                        </h4>
                        <div id="modal-comments" class="space-y-3"></div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                lucide.createIcons();
                fetchPosts();
                checkHealth();
            });
            async function checkHealth() {
                try {
                    const res = await fetch('/health');
                    if (res.ok) document.getElementById('health-badge').textContent = 'System Healthy (200 OK)';
                } catch (e) {
                    document.getElementById('health-badge').textContent = 'API Unavailable';
                }
            }
            async function fetchPosts() {
                const container = document.getElementById('posts-container');
                container.innerHTML = `<div class="col-span-full py-16 text-center text-slate-500 flex flex-col items-center justify-center"><i data-lucide="loader-2" class="w-8 h-8 animate-spin text-rose-500 mb-3"></i><p class="text-sm">投稿データを取得中...</p></div>`;
                lucide.createIcons();
                const start = performance.now();
                try {
                    const res = await fetch('/api/posts');
                    document.getElementById('metric-posts').textContent = `${Math.round(performance.now() - start)} ms`;
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const posts = await res.json();
                    if (!posts || posts.length === 0) {
                        container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500">投稿がありません。</div>`;
                        return;
                    }
                    container.innerHTML = posts.map(post => `
                        <div onclick="openPostModal(${post.id})" class="bg-slate-900/70 hover:bg-slate-850 border border-slate-800/80 hover:border-slate-700 rounded-xl p-5 flex flex-col justify-between transition cursor-pointer group shadow-lg">
                            <div>
                                <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
                                    <span class="font-medium text-slate-300 flex items-center gap-1.5"><i data-lucide="user" class="w-3.5 h-3.5 text-indigo-400"></i>${post.user_name || `User #${post.user_id}`}</span>
                                    <span>${new Date(post.created_at).toLocaleDateString('ja-JP')}</span>
                                </div>
                                <h3 class="font-bold text-white group-hover:text-rose-400 transition mb-2 text-base line-clamp-1">${escapeHtml(post.title)}</h3>
                                <p class="text-xs text-slate-400 line-clamp-3 leading-relaxed mb-4">${escapeHtml(post.content)}</p>
                            </div>
                            <div class="flex items-center justify-between pt-3 border-t border-slate-800/60 text-xs text-slate-400">
                                <span class="flex items-center gap-1"><i data-lucide="eye" class="w-3.5 h-3.5 text-slate-500"></i>${post.view_count} views</span>
                                <span class="flex items-center gap-1 text-indigo-400 font-medium"><i data-lucide="message-circle" class="w-3.5 h-3.5"></i>${post.comment_count || 0} 件</span>
                            </div>
                        </div>
                    `).join('');
                    lucide.createIcons();
                } catch (err) {
                    container.innerHTML = `<div class="col-span-full py-12 text-center text-rose-400"><i data-lucide="alert-triangle" class="w-8 h-8 mx-auto mb-2 text-rose-500"></i><p class="text-sm">データの読み込みに失敗しました: ${err.message}</p></div>`;
                    lucide.createIcons();
                }
            }
            async function openPostModal(postId) {
                const modal = document.getElementById('post-modal');
                modal.classList.remove('hidden');
                document.getElementById('modal-title').textContent = '読み込み中...';
                document.getElementById('modal-content').textContent = '';
                document.getElementById('modal-comments').innerHTML = '<p class="text-xs text-slate-500">コメントを読み込み中...</p>';
                const start = performance.now();
                try {
                    const res = await fetch(`/api/posts/${postId}`);
                    document.getElementById('metric-detail').textContent = `${Math.round(performance.now() - start)} ms`;
                    if (!res.ok) throw new Error('Not found');
                    const data = await res.json();
                    const post = data.post;
                    const comments = data.comments || [];
                    document.getElementById('modal-title').textContent = post.title;
                    document.getElementById('modal-author').textContent = post.user_name || `User #${post.user_id}`;
                    document.getElementById('modal-date').textContent = new Date(post.created_at).toLocaleString('ja-JP');
                    document.getElementById('modal-content').textContent = post.content;
                    document.getElementById('modal-comment-count').textContent = comments.length;
                    if (comments.length === 0) {
                        document.getElementById('modal-comments').innerHTML = '<p class="text-xs text-slate-500">コメントはまだありません。</p>';
                    } else {
                        document.getElementById('modal-comments').innerHTML = comments.map(c => `
                            <div class="bg-slate-950/50 rounded-lg p-3 border border-slate-800/60 text-xs">
                                <div class="flex items-center justify-between text-slate-400 mb-1">
                                    <span class="font-medium text-slate-300">User #${c.user_id}</span>
                                    <span class="text-[10px]">${new Date(c.created_at).toLocaleTimeString('ja-JP')}</span>
                                </div>
                                <p class="text-slate-300 leading-relaxed">${escapeHtml(c.body)}</p>
                            </div>
                        `).join('');
                    }
                } catch (err) {
                    document.getElementById('modal-title').textContent = 'エラー';
                    document.getElementById('modal-content').textContent = '詳細の取得に失敗しました。';
                }
            }
            function closeModal() {
                document.getElementById('post-modal').classList.add('hidden');
            }
            async function runPerformanceTest() {
                const btn = document.getElementById('btn-measure');
                btn.disabled = true;
                btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>測定中...</span>`;
                lucide.createIcons();
                const t1 = performance.now();
                await fetch('/api/posts').catch(() => {});
                document.getElementById('metric-posts').textContent = `${Math.round(performance.now() - t1)} ms`;
                const t2 = performance.now();
                await fetch('/api/posts/1').catch(() => {});
                document.getElementById('metric-detail').textContent = `${Math.round(performance.now() - t2)} ms`;
                const t3 = performance.now();
                await fetch('/api/heavy-calc').catch(() => {});
                document.getElementById('metric-calc').textContent = `${Math.round(performance.now() - t3)} ms`;
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="play" class="w-4 h-4"></i><span>⚡ 一括測定を実行</span>`;
                lucide.createIcons();
            }
            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>"']/g, function(m) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
                });
            }
        </script>
    </body>
    </html>
