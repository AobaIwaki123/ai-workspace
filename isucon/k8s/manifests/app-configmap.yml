apiVersion: v1
kind: ConfigMap
metadata:
  name: isucon-app-source
  namespace: isucon
data:
  go.mod: |
    module isucon-sandbox

    go 1.22

    require (
    	github.com/go-sql-driver/mysql v1.8.1
    	github.com/jmoiron/sqlx v1.4.0
    )

    require filippo.io/edwards25519 v1.1.0 // indirect

  go.sum: |
    filippo.io/edwards25519 v1.1.0 h1:FNf4tywRC1HmFuKW5xopWpigGjJKiJSV0Cqo0cJWDaA=
    filippo.io/edwards25519 v1.1.0/go.mod h1:BxyFTGdWcka3PhytdK4V28tE5sGfRvvvRV7EaN4VDT4=
    github.com/go-sql-driver/mysql v1.8.1 h1:LedoTUt/eveggdHS9qUFC1EFSa8bU2+1pZjSRpvNJ1Y=
    github.com/go-sql-driver/mysql v1.8.1/go.mod h1:wEBSXgmK//2ZFJyE+qWnIsVGmvmEKlqwuVSjsCm7DZg=
    github.com/jmoiron/sqlx v1.4.0 h1:1PLqN7S1UYp5t4SrVVnt4nUVNemrDAtxlulVe+Qgm3o=
    github.com/jmoiron/sqlx v1.4.0/go.mod h1:ZrZ7UsYB/weZdl2Bxg6jCRO9c3YHl8r3ahlKmRT4JLY=
    github.com/lib/pq v1.10.9 h1:YXG7RB+JIjhP29X+OtkiDnYaXQwpS4JEWq7dtCCRUEw=
    github.com/lib/pq v1.10.9/go.mod h1:AlVN5x4E4T544tWzH6hKfbfQvm3HdbOxrmggDNAPY9o=
    github.com/mattn/go-sqlite3 v1.14.22 h1:2gZY6PC6kBnID23Tichd1K+Z0oS6nE/XwU+Vz/5o4kU=
    github.com/mattn/go-sqlite3 v1.14.22/go.mod h1:Uh1q+B4BYcTPb+yiD3kU8Ct7aC0hY9fxUwlHK0RXw+Y=

  main.go: |
    package main

    import (
    	"database/sql"
    	"embed"
    	"encoding/json"
    	"fmt"
    	"io/fs"
    	"log"
    	"net/http"
    	"net/http/pprof"
    	"os"
    	"regexp"
    	"strconv"
    	"strings"
    	"time"

    	_ "github.com/go-sql-driver/mysql"
    	"github.com/jmoiron/sqlx"
    )

    //go:embed public/*
    var publicFS embed.FS

    var db *sqlx.DB

    type User struct {
    	ID        int64     `db:"id" json:"id"`
    	Name      string    `db:"name" json:"name"`
    	Email     string    `db:"email" json:"email"`
    	CreatedAt time.Time `db:"created_at" json:"created_at"`
    }

    type Post struct {
    	ID           int64     `db:"id" json:"id"`
    	UserID       int64     `db:"user_id" json:"user_id"`
    	Title        string    `db:"title" json:"title"`
    	Content      string    `db:"content" json:"content"`
    	Status       string    `db:"status" json:"status"`
    	ViewCount    int       `db:"view_count" json:"view_count"`
    	CreatedAt    time.Time `db:"created_at" json:"created_at"`
    	UserName     string    `json:"user_name,omitempty"`
    	CommentCount int       `json:"comment_count"`
    }

    type Comment struct {
    	ID        int64     `db:"id" json:"id"`
    	PostID    int64     `db:"post_id" json:"post_id"`
    	UserID    int64     `db:"user_id" json:"user_id"`
    	Body      string    `db:"body" json:"body"`
    	CreatedAt time.Time `db:"created_at" json:"created_at"`
    }

    func initDB() {
    	host := os.Getenv("MYSQL_HOST")
    	if host == "" {
    		host = "127.0.0.1"
    	}
    	port := os.Getenv("MYSQL_PORT")
    	if port == "" {
    		port = "3306"
    	}
    	user := os.Getenv("MYSQL_USER")
    	if user == "" {
    		user = "isucon"
    	}
    	pass := os.Getenv("MYSQL_PASSWORD")
    	if pass == "" {
    		pass = "isucon"
    	}
    	dbname := os.Getenv("MYSQL_DATABASE")
    	if dbname == "" {
    		dbname = "isucon"
    	}

    	dsn := fmt.Sprintf("%s:%s@tcp(%s:%s)/%s?parseTime=true&loc=Local", user, pass, host, port, dbname)
    	var err error
    	db, err = sqlx.Connect("mysql", dsn)
    	if err != nil {
    		log.Fatalf("Failed to connect to MySQL: %v", err)
    	}

    	// コネクション設定
    	db.SetMaxOpenConns(50)
    	db.SetMaxIdleConns(50)
    }

    // ❌ 意図的なボトルネック1: N+1 クエリ (投稿一覧)
    func handleGetPosts(w http.ResponseWriter, r *http.Request) {
    	// 1. 投稿一覧を取得 (status='published' でソート。IndexがないのでFull Scan)
    	var posts []Post
    	err := db.Select(&posts, "SELECT id, user_id, title, content, status, view_count, created_at FROM posts WHERE status = 'published' ORDER BY created_at DESC LIMIT 30")
    	if err != nil {
    		http.Error(w, err.Error(), http.StatusInternalServerError)
    		return
    	}

    	// 2. N+1: 投稿ごとにユーザー名とコメント数を1件ずつクエリで取得！
    	for i := range posts {
    		// ユーザー名取得 (N回クエリ)
    		var user User
    		if err := db.Get(&user, "SELECT name FROM users WHERE id = ?", posts[i].UserID); err != nil && err != sql.ErrNoRows {
    			http.Error(w, err.Error(), http.StatusInternalServerError)
    			return
    		}
    		posts[i].UserName = user.Name

    		// コメント数取得 (N回クエリ & post_idにIndexがないので毎回Full Scan)
    		var count int
    		if err := db.Get(&count, "SELECT COUNT(*) FROM comments WHERE post_id = ?", posts[i].ID); err != nil && err != sql.ErrNoRows {
    			http.Error(w, err.Error(), http.StatusInternalServerError)
    			return
    		}
    		posts[i].CommentCount = count
    	}

    	w.Header().Set("Content-Type", "application/json")
    	json.NewEncoder(w).Encode(posts)
    }

    // ❌ 意図的なボトルネック2: スロークエリ (単一投稿詳細)
    func handleGetPostDetail(w http.ResponseWriter, r *http.Request) {
    	idStr := strings.TrimPrefix(r.URL.Path, "/api/posts/")
    	id, err := strconv.ParseInt(idStr, 10, 64)
    	if err != nil {
    		http.Error(w, "Invalid post ID", http.StatusBadRequest)
    		return
    	}

    	var post Post
    	err = db.Get(&post, "SELECT * FROM posts WHERE id = ?", id)
    	if err == sql.ErrNoRows {
    		http.Error(w, "Post not found", http.StatusNotFound)
    		return
    	} else if err != nil {
    		http.Error(w, err.Error(), http.StatusInternalServerError)
    		return
    	}

    	// コメント一覧 (post_idにIndexなし)
    	var comments []Comment
    	if err := db.Select(&comments, "SELECT * FROM comments WHERE post_id = ? ORDER BY created_at ASC", id); err != nil {
    		http.Error(w, err.Error(), http.StatusInternalServerError)
    		return
    	}

    	w.Header().Set("Content-Type", "application/json")
    	json.NewEncoder(w).Encode(map[string]interface{}{
    		"post":     post,
    		"comments": comments,
    	})
    }

    // ❌ 意図的なボトルネック3: CPU負荷（正規表現のコンパイルループ）
    func handleHeavyCalc(w http.ResponseWriter, r *http.Request) {
    	text := "ISUCON is a competition where you speed up web applications to the maximum limit!"
    	matchCount := 0

    	// 毎回正規表現を再コンパイルする悪手 (pprofのCPUプロファイルで劇的に目立つ)
    	for i := 0; i < 5000; i++ {
    		re := regexp.MustCompile(`(ISUCON|applications|limit)`)
    		if re.MatchString(text) {
    			matchCount++
    		}
    	}

    	w.Header().Set("Content-Type", "application/json")
    	json.NewEncoder(w).Encode(map[string]interface{}{
    		"result": "ok",
    		"count":  matchCount,
    	})
    }

    func main() {
    	initDB()
    	log.Println("Database connected successfully.")

    	// pprof を別ポート (6060) で起動
    	go func() {
    		log.Println("Starting pprof on :6060")
    		if err := http.ListenAndServe("0.0.0.0:6060", nil); err != nil {
    			log.Printf("pprof server error: %v", err)
    		}
    	}()

    	mux := http.NewServeMux()
    	mux.HandleFunc("/health", func(w http.ResponseWriter, r *http.Request) {
    		w.WriteHeader(http.StatusOK)
    		w.Write([]byte("OK"))
    	})
    	mux.HandleFunc("/api/posts", handleGetPosts)
    	mux.HandleFunc("/api/posts/", handleGetPostDetail)
    	mux.HandleFunc("/api/heavy-calc", handleHeavyCalc)

    	// pprof ハンドラをメイン mux にも登録
    	mux.HandleFunc("/debug/pprof/", pprof.Index)
    	mux.HandleFunc("/debug/pprof/cmdline", pprof.Cmdline)
    	mux.HandleFunc("/debug/pprof/profile", pprof.Profile)
    	mux.HandleFunc("/debug/pprof/symbol", pprof.Symbol)
    	mux.HandleFunc("/debug/pprof/trace", pprof.Trace)

    	// 静的フロントエンド配信 (index.html)
    	if subFS, err := fs.Sub(publicFS, "public"); err == nil {
    		mux.Handle("/", http.FileServer(http.FS(subFS)))
    	}

    	server := &http.Server{
    		Addr:    ":8000",
    		Handler: mux,
    	}

    	log.Println("Starting API server on :8000")
    	if err := server.ListenAndServe(); err != nil {
    		log.Fatalf("Server error: %v", err)
    	}
    }

  index.html: |
    <!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ISUCON API Inspector & Benchmark Console</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
            body { font-family: 'Inter', sans-serif; }
            code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; }
            .method-get { @apply bg-blue-500/10 text-blue-400 border-blue-500/30; }
            .method-badge { @apply px-2.5 py-1 rounded-md text-xs font-bold font-mono tracking-wide uppercase; }
        </style>
    </head>
    <body class="bg-slate-950 text-slate-200 min-h-screen">
        <header class="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50 backdrop-blur">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-mono font-bold text-sm">
                        API
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <h1 class="text-base font-bold text-white">ISUCON API Inspector & Benchmark Console</h1>
                            <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">v1.0.0</span>
                        </div>
                        <p class="text-xs text-slate-400 font-mono" id="current-host-label">[Base URL: <span id="base-url-display"></span>]</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <div id="system-health-badge" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-md bg-slate-800/80 border border-slate-700 text-xs font-mono text-slate-300">
                        <span class="w-2 h-2 rounded-full bg-slate-500" id="health-dot"></span>
                        <span id="health-text">Checking...</span>
                    </div>
                    <a href="/debug/pprof/" target="_blank" class="flex items-center space-x-1 px-2.5 py-1 rounded-md bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-400 text-xs font-mono transition">
                        <i data-lucide="activity" class="w-3.5 h-3.5"></i>
                        <span>/debug/pprof/</span>
                    </a>
                </div>
            </div>
        </header>
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-start space-x-3 text-xs text-slate-400">
                <i data-lucide="info" class="w-4 h-4 text-cyan-400 mt-0.5 shrink-0"></i>
                <div>
                    <span class="text-slate-200 font-semibold">実リクエスト透過インスペクター:</span>
                    各エンドポイントをクリックして展開し、パラメータや測定モード（単発 / 並行パルス負荷）を選択して「Execute & Measure」を実行してください。
                    ブラウザから実際にバックエンドへリクエストを送信し、<span class="text-slate-200">往復レイテンシ、HTTPヘッダ、生レスポンス、SQL発行構造</span> を透過的に確認できます。
                </div>
            </div>
            <div class="space-y-4">
                <div class="border border-slate-800 bg-slate-900 rounded-xl overflow-hidden shadow-sm" id="ep-posts">
                    <div onclick="toggleAccordion('ep-posts')" class="px-5 py-4 flex items-center justify-between cursor-pointer hover:bg-slate-850 transition border-b border-transparent group">
                        <div class="flex items-center space-x-3">
                            <span class="method-badge method-get">GET</span>
                            <span class="font-mono text-sm font-bold text-white group-hover:text-blue-400 transition">/api/posts</span>
                            <span class="text-xs text-slate-400 hidden sm:inline">— 投稿一覧の取得</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-[11px] font-mono px-2 py-0.5 rounded bg-rose-500/10 text-rose-400 border border-rose-500/20 font-medium">🔴 N+1 ボトルネック (31 Queries)</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform duration-200 accordion-icon"></i>
                        </div>
                    </div>
                    <div class="accordion-content hidden border-t border-slate-800 p-5 bg-slate-950/40 space-y-4">
                        <div class="bg-slate-900/90 rounded-lg p-3.5 border border-slate-800 space-y-2 text-xs">
                            <div class="font-semibold text-rose-400 flex items-center gap-1.5"><i data-lucide="database" class="w-3.5 h-3.5"></i><span>バックエンドの SQL 発行構造 (ボトルネック)</span></div>
                            <div class="font-mono text-[11px] text-slate-300 space-y-1 bg-slate-950 p-2.5 rounded border border-slate-855">
                                <div class="text-slate-400">1. <span class="text-blue-400">SELECT</span> id, user_id, title... <span class="text-blue-400">FROM</span> posts <span class="text-blue-400">WHERE</span> status = 'published' <span class="text-blue-400">ORDER BY</span> created_at <span class="text-blue-400">DESC LIMIT</span> 30; <span class="text-amber-500/80">(1回)</span></div>
                                <div class="text-slate-400">2. <span class="text-rose-400">SELECT</span> name <span class="text-rose-400">FROM</span> users <span class="text-rose-400">WHERE</span> id = ?; <span class="text-rose-400 font-bold">(30回ループクエリ / N+1)</span></div>
                                <div class="text-slate-400">3. <span class="text-rose-400">SELECT COUNT</span>(*) <span class="text-rose-400">FROM</span> comments <span class="text-rose-400">WHERE</span> post_id = ?; <span class="text-rose-400 font-bold">(30回ループクエリ / N+1 & Full Scan)</span></div>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 bg-slate-900/60 p-3.5 rounded-lg border border-slate-800 text-xs">
                            <div>
                                <label class="block text-slate-400 mb-1 font-medium">測定モード</label>
                                <select id="posts-mode" class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-white font-mono">
                                    <option value="single">Single (単発 1 Request)</option>
                                    <option value="burst" selected>Concurrent Burst (並行 20 Requests)</option>
                                    <option value="heavy">Heavy Burst (並行 50 Requests)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-slate-400 mb-1 font-medium">並行度 (Concurrency)</label>
                                <input type="number" id="posts-concurrency" value="5" min="1" max="20" class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-white font-mono">
                            </div>
                            <div class="flex items-end">
                                <button onclick="executeEndpoint('/api/posts', 'posts-mode', 'posts-concurrency', 'posts-res')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-mono font-semibold py-1.5 px-4 rounded transition flex items-center justify-center gap-1.5 cursor-pointer">
                                    <i data-lucide="play" class="w-3.5 h-3.5"></i>
                                    <span>Execute & Measure</span>
                                </button>
                            </div>
                        </div>
                        <div id="posts-res" class="hidden space-y-3">
                            <div class="metric-summary grid grid-cols-2 sm:grid-cols-5 gap-2 font-mono text-xs"></div>
                            <div class="raw-response bg-slate-950 rounded-lg p-3 border border-slate-800 font-mono text-xs"></div>
                        </div>
                    </div>
                </div>
                <div class="border border-slate-800 bg-slate-900 rounded-xl overflow-hidden shadow-sm" id="ep-detail">
                    <div onclick="toggleAccordion('ep-detail')" class="px-5 py-4 flex items-center justify-between cursor-pointer hover:bg-slate-850 transition border-b border-transparent group">
                        <div class="flex items-center space-x-3">
                            <span class="method-badge method-get">GET</span>
                            <span class="font-mono text-sm font-bold text-white group-hover:text-blue-400 transition">/api/posts/{id}</span>
                            <span class="text-xs text-slate-400 hidden sm:inline">— 単一投稿詳細 & コメント一覧</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-[11px] font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">🟢 単一投稿取得</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform duration-200 accordion-icon"></i>
                        </div>
                    </div>
                    <div class="accordion-content hidden border-t border-slate-800 p-5 bg-slate-950/40 space-y-4">
                        <div class="bg-slate-900/90 rounded-lg p-3.5 border border-slate-800 space-y-2 text-xs">
                            <div class="font-semibold text-cyan-400 flex items-center gap-1.5"><i data-lucide="database" class="w-3.5 h-3.5"></i><span>バックエンドの SQL 発行構造</span></div>
                            <div class="font-mono text-[11px] text-slate-300 space-y-1 bg-slate-950 p-2.5 rounded border border-slate-850">
                                <div class="text-slate-400">1. <span class="text-blue-400">SELECT</span> * <span class="text-blue-400">FROM</span> posts <span class="text-blue-400">WHERE</span> id = ?; <span class="text-emerald-400">(Primary Key Lookup)</span></div>
                                <div class="text-slate-400">2. <span class="text-blue-400">SELECT</span> * <span class="text-blue-400">FROM</span> comments <span class="text-blue-400">WHERE</span> post_id = ? <span class="text-blue-400">ORDER BY</span> created_at <span class="text-blue-400">ASC</span>;</div>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 bg-slate-900/60 p-3.5 rounded-lg border border-slate-800 text-xs">
                            <div>
                                <label class="block text-slate-400 mb-1 font-medium">投稿 ID ({id})</label>
                                <input type="number" id="detail-id" value="1" min="1" max="1000" class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-white font-mono">
                            </div>
                            <div>
                                <label class="block text-slate-400 mb-1 font-medium">測定モード</label>
                                <select id="detail-mode" class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-white font-mono">
                                    <option value="single" selected>Single (単発 1 Request)</option>
                                    <option value="burst">Concurrent Burst (並行 20 Requests)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-slate-400 mb-1 font-medium">並行度 (Concurrency)</label>
                                <input type="number" id="detail-concurrency" value="5" min="1" max="20" class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-white font-mono">
                            </div>
                            <div class="flex items-end">
                                <button onclick="executeDetailEndpoint()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-mono font-semibold py-1.5 px-4 rounded transition flex items-center justify-center gap-1.5 cursor-pointer">
                                    <i data-lucide="play" class="w-3.5 h-3.5"></i>
                                    <span>Execute & Measure</span>
                                </button>
                            </div>
                        </div>
                        <div id="detail-res" class="hidden space-y-3">
                            <div class="metric-summary grid grid-cols-2 sm:grid-cols-5 gap-2 font-mono text-xs"></div>
                            <div class="raw-response bg-slate-950 rounded-lg p-3 border border-slate-800 font-mono text-xs"></div>
                        </div>
                    </div>
                </div>
                <div class="border border-slate-800 bg-slate-900 rounded-xl overflow-hidden shadow-sm" id="ep-calc">
                    <div onclick="toggleAccordion('ep-calc')" class="px-5 py-4 flex items-center justify-between cursor-pointer hover:bg-slate-850 transition border-b border-transparent group">
                        <div class="flex items-center space-x-3">
                            <span class="method-badge method-get">GET</span>
                            <span class="font-mono text-sm font-bold text-white group-hover:text-blue-400 transition">/api/heavy-calc</span>
                            <span class="text-xs text-slate-400 hidden sm:inline">— CPU 負荷テスト（正規表現ループ）</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-[11px] font-mono px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium">🟡 CPU ボトルネック (5,000 compiles)</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform duration-200 accordion-icon"></i>
                        </div>
                    </div>
                    <div class="accordion-content hidden border-t border-slate-800 p-5 bg-slate-950/40 space-y-4">
                        <div class="bg-slate-900/90 rounded-lg p-3.5 border border-slate-800 space-y-2 text-xs">
                            <div class="font-semibold text-amber-400 flex items-center gap-1.5"><i data-lucide="cpu" class="w-3.5 h-3.5"></i><span>バックエンドの CPU 負荷構造</span></div>
                            <div class="font-mono text-[11px] text-slate-300 space-y-1 bg-slate-950 p-2.5 rounded border border-slate-850">
                                <div class="text-slate-400"><span class="text-amber-400">for</span> i := 0; i &lt; 5000; i++ {</div>
                                <div class="text-slate-400 pl-4">re := <span class="text-rose-400 font-bold">regexp.MustCompile</span>(`(ISUCON|applications|limit)`) <span class="text-rose-400">// 毎回再コンパイル</span></div>
                                <div class="text-slate-400 pl-4">re.MatchString(text)</div>
                                <div class="text-slate-400">}</div>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 bg-slate-900/60 p-3.5 rounded-lg border border-slate-800 text-xs">
                            <div>
                                <label class="block text-slate-400 mb-1 font-medium">測定モード</label>
                                <select id="calc-mode" class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-white font-mono">
                                    <option value="single">Single (単発 1 Request)</option>
                                    <option value="burst" selected>Concurrent Burst (並行 20 Requests)</option>
                                    <option value="heavy">Heavy CPU Load (並行 50 Requests)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-slate-400 mb-1 font-medium">並行度 (Concurrency)</label>
                                <input type="number" id="calc-concurrency" value="5" min="1" max="20" class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-white font-mono">
                            </div>
                            <div class="flex items-end">
                                <button onclick="executeEndpoint('/api/heavy-calc', 'calc-mode', 'calc-concurrency', 'calc-res')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-mono font-semibold py-1.5 px-4 rounded transition flex items-center justify-center gap-1.5 cursor-pointer">
                                    <i data-lucide="play" class="w-3.5 h-3.5"></i>
                                    <span>Execute & Measure</span>
                                </button>
                            </div>
                        </div>
                        <div id="calc-res" class="hidden space-y-3">
                            <div class="metric-summary grid grid-cols-2 sm:grid-cols-5 gap-2 font-mono text-xs"></div>
                            <div class="raw-response bg-slate-950 rounded-lg p-3 border border-slate-800 font-mono text-xs"></div>
                        </div>
                    </div>
                </div>
                <div class="border border-slate-800 bg-slate-900 rounded-xl overflow-hidden shadow-sm" id="ep-health">
                    <div onclick="toggleAccordion('ep-health')" class="px-5 py-4 flex items-center justify-between cursor-pointer hover:bg-slate-850 transition border-b border-transparent group">
                        <div class="flex items-center space-x-3">
                            <span class="method-badge method-get">GET</span>
                            <span class="font-mono text-sm font-bold text-white group-hover:text-blue-400 transition">/health</span>
                            <span class="text-xs text-slate-400 hidden sm:inline">— システムヘルスチェック (200 OK)</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-[11px] font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">🟢 ヘルスチェック</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform duration-200 accordion-icon"></i>
                        </div>
                    </div>
                    <div class="accordion-content hidden border-t border-slate-800 p-5 bg-slate-950/40 space-y-4">
                        <div class="flex items-center justify-between bg-slate-900/60 p-3.5 rounded-lg border border-slate-800 text-xs">
                            <span class="text-slate-400">サーバーが稼働中であればプレーンテキストで "OK" を返します。</span>
                            <button onclick="executeEndpoint('/health', null, null, 'health-res', 'single')" class="bg-blue-600 hover:bg-blue-500 text-white font-mono font-semibold py-1.5 px-4 rounded transition flex items-center gap-1.5 cursor-pointer">
                                <i data-lucide="play" class="w-3.5 h-3.5"></i>
                                <span>Execute</span>
                            </button>
                        </div>
                        <div id="health-res" class="hidden space-y-3">
                            <div class="metric-summary grid grid-cols-2 sm:grid-cols-5 gap-2 font-mono text-xs"></div>
                            <div class="raw-response bg-slate-950 rounded-lg p-3 border border-slate-800 font-mono text-xs"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                lucide.createIcons();
                document.getElementById('base-url-display').textContent = window.location.origin;
                checkInitialHealth();
            });
            function toggleAccordion(id) {
                const el = document.getElementById(id);
                const content = el.querySelector('.accordion-content');
                const icon = el.querySelector('.accordion-icon');
                const isHidden = content.classList.contains('hidden');
                content.classList.toggle('hidden');
                icon.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
            }
            async function checkInitialHealth() {
                const start = performance.now();
                try {
                    const res = await fetch('/health');
                    const duration = Math.round(performance.now() - start);
                    if (res.ok) {
                        document.getElementById('health-dot').className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
                        document.getElementById('health-text').textContent = `Healthy (${duration}ms)`;
                    } else {
                        throw new Error();
                    }
                } catch (e) {
                    document.getElementById('health-dot').className = 'w-2 h-2 rounded-full bg-rose-500';
                    document.getElementById('health-text').textContent = 'Unavailable';
                }
            }
            function executeDetailEndpoint() {
                const id = document.getElementById('detail-id').value || 1;
                executeEndpoint(`/api/posts/${id}`, 'detail-mode', 'detail-concurrency', 'detail-res');
            }
            async function executeEndpoint(path, modeSelectId, concurrencyInputId, resultContainerId, forceMode = null) {
                const resContainer = document.getElementById(resultContainerId);
                resContainer.classList.remove('hidden');
                const summaryEl = resContainer.querySelector('.metric-summary');
                const rawEl = resContainer.querySelector('.raw-response');
                const mode = forceMode || (modeSelectId ? document.getElementById(modeSelectId).value : 'single');
                const concurrency = concurrencyInputId ? parseInt(document.getElementById(concurrencyInputId).value, 10) || 5 : 1;
                const count = mode === 'heavy' ? 50 : (mode === 'burst' ? 20 : 1);
                rawEl.innerHTML = `<div class="py-4 text-center text-slate-400 flex items-center justify-center gap-2 font-mono"><i data-lucide="loader-2" class="w-4 h-4 animate-spin text-blue-400"></i><span>測定中 (${count} requests, concurrency: ${concurrency})...</span></div>`;
                summaryEl.innerHTML = '';
                lucide.createIcons();
                const latencies = [];
                let successes = 0;
                let failures = 0;
                let lastStatus = 0;
                let lastStatusText = '';
                let lastBodyText = '';
                let lastHeaders = {};
                let lastContentLength = 0;
                const totalStartTime = performance.now();
                const queue = Array.from({ length: count }, (_, i) => i);
                const workers = Array.from({ length: Math.min(concurrency, count) }, async () => {
                    while (queue.length > 0) {
                        queue.shift();
                        const reqStart = performance.now();
                        try {
                            const res = await fetch(path);
                            const duration = performance.now() - reqStart;
                            latencies.push(duration);
                            if (res.ok) successes++; else failures++;
                            lastStatus = res.status;
                            lastStatusText = res.statusText || (res.ok ? 'OK' : 'Error');
                            if (queue.length === 0) {
                                lastHeaders = Object.fromEntries(res.headers.entries());
                                lastBodyText = await res.text();
                                lastContentLength = lastBodyText.length;
                            }
                        } catch (err) {
                            failures++;
                            lastStatus = 0;
                            lastStatusText = 'Network Error';
                        }
                    }
                });
                await Promise.all(workers);
                const totalDuration = performance.now() - totalStartTime;
                latencies.sort((a, b) => a - b);
                const min = latencies.length > 0 ? latencies[0].toFixed(1) : 0;
                const max = latencies.length > 0 ? latencies[latencies.length - 1].toFixed(1) : 0;
                const avg = latencies.length > 0 ? (latencies.reduce((a, b) => a + b, 0) / latencies.length).toFixed(1) : 0;
                const p95 = latencies.length > 0 ? latencies[Math.floor(latencies.length * 0.95)].toFixed(1) : 0;
                const qps = (count / (totalDuration / 1000)).toFixed(1);
                summaryEl.innerHTML = `
                    <div class="bg-slate-900 p-2.5 rounded border border-slate-800 text-center"><span class="text-[10px] text-slate-500 block">HTTP STATUS</span><span class="font-bold ${lastStatus >= 200 && lastStatus < 300 ? 'text-emerald-400' : 'text-rose-400'}">${lastStatus || 'ERR'} ${lastStatusText}</span></div>
                    <div class="bg-slate-900 p-2.5 rounded border border-slate-800 text-center"><span class="text-[10px] text-slate-500 block">AVG LATENCY</span><span class="font-bold text-white">${avg} <span class="text-[10px] text-slate-400 font-normal">ms</span></span></div>
                    <div class="bg-slate-900 p-2.5 rounded border border-slate-800 text-center"><span class="text-[10px] text-slate-500 block">P95 / MAX</span><span class="font-bold text-amber-400">${p95} / ${max} <span class="text-[10px] text-slate-400 font-normal">ms</span></span></div>
                    <div class="bg-slate-900 p-2.5 rounded border border-slate-800 text-center"><span class="text-[10px] text-slate-500 block">THROUGHPUT</span><span class="font-bold text-cyan-400">${qps} <span class="text-[10px] text-slate-400 font-normal">req/s</span></span></div>
                    <div class="bg-slate-900 p-2.5 rounded border border-slate-800 text-center"><span class="text-[10px] text-slate-500 block">SUCCESS / TOTAL</span><span class="font-bold ${failures === 0 ? 'text-emerald-400' : 'text-rose-400'}">${successes} / ${count}</span></div>
                `;
                let formattedBody = lastBodyText;
                try {
                    const parsed = JSON.parse(lastBodyText);
                    formattedBody = JSON.stringify(parsed, null, 2);
                } catch (e) {}
                rawEl.innerHTML = `
                    <div class="flex items-center justify-between text-slate-400 pb-2 border-b border-slate-850 text-[11px] mb-2">
                        <span class="flex items-center gap-1.5 text-slate-300"><i data-lucide="terminal" class="w-3.5 h-3.5 text-blue-400"></i><span>Raw Response Payload (${(lastContentLength / 1024).toFixed(2)} KB)</span></span>
                        <span class="text-slate-500">Content-Type: ${lastHeaders['content-type'] || 'unknown'}</span>
                    </div>
                    <pre class="overflow-x-auto text-[11px] text-slate-300 leading-relaxed max-h-72 select-all">${escapeHtml(formattedBody)}</pre>
                `;
                lucide.createIcons();
            }
            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>"']/g, function(m) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
                });
            }
        </script>
    </body>
    </html>
