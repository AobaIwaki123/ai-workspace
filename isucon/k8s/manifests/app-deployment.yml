apiVersion: apps/v1
kind: Deployment
metadata:
  name: isucon-app
  namespace: isucon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: isucon-app
  template:
    metadata:
      labels:
        app: isucon-app
    spec:
      initContainers:
        - name: builder
          image: golang:1.22-alpine
          command:
            - /bin/sh
            - -c
            - |
              cp -r /src-cm/* /tmp/src/
              cd /tmp/src
              CGO_ENABLED=0 GOOS=linux go build -o /app/server .
          volumeMounts:
            - name: source
              mountPath: /src-cm
            - name: app-bin
              mountPath: /app
      containers:
        - name: app
          image: alpine:3.19
          command: ["/app/server"]
          env:
            - name: MYSQL_HOST
              value: "isucon-mysql"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: "isucon"
            - name: MYSQL_PASSWORD
              value: "isucon"
            - name: MYSQL_DATABASE
              value: "isucon"
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 6060
              name: pprof
          volumeMounts:
            - name: app-bin
              mountPath: /app
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 3
      volumes:
        - name: source
          configMap:
            name: isucon-app-source
        - name: app-bin
          emptyDir: {}
