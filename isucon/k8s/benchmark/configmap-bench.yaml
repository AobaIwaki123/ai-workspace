apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmarker-script
  namespace: isucon
data:
  bench.sh: |
    #!/bin/sh
    set -e
    TARGET_URL="${1:-http://nginx.isucon.svc.cluster.local}"
    DURATION_SEC="${2:-10}"
    CONCURRENCY=5

    echo "=========================================="
    echo "🚀 Kubernetes クラスタ内からベンチマークを開始します..."
    echo "ターゲット: ${TARGET_URL}"
    echo "実行時間: ${DURATION_SEC} 秒 (並行数: ${CONCURRENCY})"
    echo "=========================================="

    END_TIME=$(( $(date +%s) + DURATION_SEC ))
    TOTAL_REQUESTS=0
    SUCCESS_COUNT=0
    FAIL_COUNT=0

    run_worker() {
        worker_id=$1
        ok_count=0
        ng_count=0

        while [ $(date +%s) -lt $END_TIME ]; do
            # 1. 投稿一覧取得
            if curl -s -f --max-time 3 --connect-timeout 2 "${TARGET_URL}/api/posts" > /dev/null; then
                ok_count=$((ok_count + 1))
            else
                ng_count=$((ng_count + 1))
            fi

            # 2. 投稿詳細取得
            post_id=$(( (RANDOM % 20) + 1 ))
            if curl -s -f --max-time 3 --connect-timeout 2 "${TARGET_URL}/api/posts/${post_id}" > /dev/null; then
                ok_count=$((ok_count + 1))
            else
                ng_count=$((ng_count + 1))
            fi

            # 3. CPU負荷エンドポイント
            if curl -s -f --max-time 3 --connect-timeout 2 "${TARGET_URL}/api/heavy-calc" > /dev/null; then
                ok_count=$((ok_count + 1))
            else
                ng_count=$((ng_count + 1))
            fi
        done

        echo "${ok_count},${ng_count}" > "/tmp/bench_res_${worker_id}.txt"
    }

    # ワーカー並行実行
    i=1
    while [ $i -le $CONCURRENCY ]; do
        run_worker $i &
        i=$((i + 1))
    done

    wait

    # 集計
    i=1
    while [ $i -le $CONCURRENCY ]; do
        if [ -f "/tmp/bench_res_${i}.txt" ]; then
            IFS=',' read -r ok ng < "/tmp/bench_res_${i}.txt"
            SUCCESS_COUNT=$((SUCCESS_COUNT + ok))
            FAIL_COUNT=$((FAIL_COUNT + ng))
            TOTAL_REQUESTS=$((TOTAL_REQUESTS + ok + ng))
            rm -f "/tmp/bench_res_${i}.txt"
        fi
        i=$((i + 1))
    done

    QPS=$(( TOTAL_REQUESTS / DURATION_SEC ))
    SCORE=$(( SUCCESS_COUNT * 10 - FAIL_COUNT * 50 ))

    echo "=========================================="
    echo "🏁 ベンチマーク終了"
    echo "総リクエスト数: ${TOTAL_REQUESTS}"
    echo "成功: ${SUCCESS_COUNT}, 失敗: ${FAIL_COUNT}"
    echo "QPS: ${QPS} req/sec"
    echo "🏆 スコア: ${SCORE}"
    echo "=========================================="
